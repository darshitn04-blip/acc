services:
  - type: web
    name: civicfix
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: UPLOAD_DIR
        value: /data/uploads

databases:
  - name: civicfix-db
    databaseName: civicfix
    user: civicfix
    plan: free
    region: singapore
    postgresMajorVersion: "16"
